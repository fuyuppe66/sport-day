apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-spin
  namespace: sport-spin
  labels:
    app.kubernetes.io/name: sport-spin
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The saved-spin state lives on a ReadWriteOnce volume (single writer),
  # so never run two pods against it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sport-spin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sport-spin
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: sport-spin
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: sport-spin:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sport-spin-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /var/lib/sport-state
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: sport-spin-state
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi